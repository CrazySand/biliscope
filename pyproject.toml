[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biliscope"
version = "0.1.0"
description = "B 站协议观察工具箱：wbi 签名、评论区采集、视频与番剧"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["bilibili", "wbi", "comments", "crawler"]
dependencies = ["requests>=2.31"]

[project.scripts]
bs = "biliscope.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/biliscope"]
